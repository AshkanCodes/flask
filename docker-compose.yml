services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flaskr
      POSTGRES_USER: flaskr
      POSTGRES_PASSWORD: flaskr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flaskr -d flaskr"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
    environment:
      # App still uses SQLite by default; DB container is present for Part 3 requirements.
      DATABASE_URL: postgresql://flaskr:flaskr@db:5432/flaskr
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:8000"
    restart: unless-stopped

volumes:
  pgdata:
